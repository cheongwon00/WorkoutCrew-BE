spring.application.name=workoutcrew
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/workoutcrew?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:workoutcrew}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.time-zone=Asia/Seoul
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=strict
server.servlet.session.timeout=${SESSION_TIMEOUT:30m}
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:WARN}
